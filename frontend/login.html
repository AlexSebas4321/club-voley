<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión — Club de Voley</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

<div class="deco-ball"></div>

<section class="auth-hero">
  <div class="auth-brand">
    <span class="ball big-ball"></span>
    <h1>Club de Voley</h1>
    <p>Toda la información del club en un solo lugar</p>
  </div>

  <div class="auth-cards">
    <div class="auth-col">
      <div class="auth-card">
        <div class="auth-card-head">
          <h2>Iniciar sesión</h2>
          <span class="badge gold">Bienvenido de nuevo</span>
        </div>
        <form id="form-login" class="form-box auth-form">
          <div id="login-alert"></div>
          <div class="field">
            <label>Email</label>
            <div class="input-icon">
              <span>✉️</span>
              <input type="email" id="login-email" placeholder="tu@email.com" required>
            </div>
          </div>
          <div class="field">
            <label>Contraseña</label>
            <div class="input-icon">
              <span>🔒</span>
              <input type="password" id="login-pass" placeholder="••••••••" required>
            </div>
          </div>
          <button class="btn btn-primary btn-block" type="submit">Ingresar</button>
          <p class="auth-hint">¿No tenés cuenta? Usá el formulario de registro.</p>
        </form>
      </div>
    </div>

    <div class="auth-col alt">
      <div class="auth-card dark">
        <div class="auth-card-head">
          <h2>Registrarme como jugador</h2>
          <span class="badge orange">Nuevo ingreso</span>
        </div>
        <form id="form-registro" class="form-box auth-form transparent">
          <div id="reg-alert"></div>
          <div class="field">
            <label>Nombre completo</label>
            <div class="input-icon">
              <span>👤</span>
              <input type="text" id="reg-nombre" placeholder="Nombre y apellido" required>
            </div>
          </div>
          <div class="field">
            <label>Email</label>
            <div class="input-icon">
              <span>✉️</span>
              <input type="email" id="reg-email" placeholder="tu@email.com" required>
            </div>
          </div>
          <div class="field">
            <label>Contraseña</label>
            <div class="input-icon">
              <span>🔒</span>
              <input type="password" id="reg-pass" placeholder="Mínimo 6 caracteres" required minlength="6">
            </div>
          </div>
          <div class="field">
            <label>Fecha de nacimiento</label>
            <div class="input-icon">
              <span>🎂</span>
              <input type="date" id="reg-nacimiento">
            </div>
          </div>
          <div class="field">
            <label>Posición de juego</label>
            <div class="input-icon">
              <span>🏐</span>
              <select id="reg-posicion">
                <option value="">Sin especificar</option>
                <option>Armador</option>
                <option>Punta</option>
                <option>Central</option>
                <option>Opuesto</option>
                <option>Líbero</option>
              </select>
            </div>
          </div>
          <button class="btn btn-gold btn-block" type="submit">Crear cuenta</button>
          <p class="auth-hint">Luego podés iniciar sesión con tu email y contraseña.</p>
        </form>
      </div>
    </div>
  </div>
</section>

<footer class="site-footer"><div class="wrap">Club de Voley — Sitio institucional</div></footer>

<script src="js/api.js"></script>
<script>
document.getElementById('form-login').addEventListener('submit', async (e) => {
  e.preventDefault();
  const alertBox = document.getElementById('login-alert');
  alertBox.innerHTML = '';
  try {
    const data = await apiFetch('/auth/login', {
      method: 'POST',
      body: {
        email: document.getElementById('login-email').value,
        contrasena: document.getElementById('login-pass').value,
      },
    });
    Sesion.guardar(data.token, data.usuario);
    const destino = data.usuario.rol === 'administrador' ? 'panel-admin.html'
                  : data.usuario.rol === 'director_tecnico' ? 'panel-director.html'
                  : 'panel-jugador.html';
    window.location.href = destino;
  } catch (err) {
    alertBox.innerHTML = `<div class="alert alert-error">${esc(err.message)}</div>`;
  }
});

document.getElementById('form-registro').addEventListener('submit', async (e) => {
  e.preventDefault();
  const alertBox = document.getElementById('reg-alert');
  alertBox.innerHTML = '';
  try {
    await apiFetch('/auth/register', {
      method: 'POST',
      body: {
        nombre: document.getElementById('reg-nombre').value,
        email: document.getElementById('reg-email').value,
        contrasena: document.getElementById('reg-pass').value,
        fecha_nacimiento: document.getElementById('reg-nacimiento').value || null,
        posicion: document.getElementById('reg-posicion').value || null,
      },
    });
    alertBox.innerHTML = `<div class="alert alert-ok">Cuenta creada. Ya podés iniciar sesión con tu email y contraseña.</div>`;
    e.target.reset();
  } catch (err) {
    alertBox.innerHTML = `<div class="alert alert-error">${esc(err.message)}</div>`;
  }
});
</script>
</body>
</html>
