<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Horarios — Club de Voley</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap nav-row">
    <a class="brand" href="index.html"><span class="ball"></span> Club de Voley</a>
    <nav class="nav-links">
      <a href="index.html">Inicio</a>
      <a href="noticias.html">Noticias</a>
      <a href="horarios.html" class="active">Horarios</a>
      <a href="resultados.html">Resultados</a>
      <a href="galeria.html">Galería</a>
    </nav>
    <div class="nav-actions" id="nav-actions"></div>
  </div>
</header>

<section class="block">
  <div class="wrap">
    <div class="section-title">
      <h2>Horarios de entrenamiento</h2>
      <span class="tag">Por equipo y categoría</span>
    </div>
    <div id="lista"><div class="empty-state">Cargando horarios…</div></div>
  </div>
</section>

<footer class="site-footer"><div class="wrap">Club de Voley — Sitio institucional</div></footer>

<script src="js/api.js"></script>
<script>
async function cargar() {
  const cont = document.getElementById('lista');
  try {
    const horarios = await apiFetch('/horarios');
    if (horarios.length === 0) {
      cont.innerHTML = '<div class="empty-state">Aún no hay horarios cargados.</div>';
      return;
    }
    const porEquipo = {};
    horarios.forEach(h => {
      porEquipo[h.nombre_equipo] = porEquipo[h.nombre_equipo] || [];
      porEquipo[h.nombre_equipo].push(h);
    });
    cont.innerHTML = Object.entries(porEquipo).map(([equipo, filas]) => `
      <div class="card" style="margin-bottom:16px;">
        <h3>${esc(equipo)}</h3>
        ${filas.map(f => `
          <div class="horario-row">
            <div class="dia">${esc(f.dia)}</div>
            <div>${f.hora_inicio.slice(0,5)} a ${f.hora_fin.slice(0,5)} hs</div>
            <div>${esc(f.lugar || '—')}</div>
          </div>`).join('')}
      </div>`).join('');
  } catch (e) {
    cont.innerHTML = `<div class="empty-state">No se pudo conectar con el servidor (${esc(e.message)}).</div>`;
  }
}
cargar();
</script>
</body>
</html>
