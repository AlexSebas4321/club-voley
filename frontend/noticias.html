<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noticias — Club de Voley</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap nav-row">
    <a class="brand" href="index.html"><span class="ball"></span> Club de Voley</a>
    <nav class="nav-links">
      <a href="index.html">Inicio</a>
      <a href="noticias.html" class="active">Noticias</a>
      <a href="horarios.html">Horarios</a>
      <a href="resultados.html">Resultados</a>
      <a href="galeria.html">Galería</a>
    </nav>
    <div class="nav-actions" id="nav-actions"></div>
  </div>
</header>

<section class="block">
  <div class="wrap">
    <div class="section-title">
      <h2>Noticias del club</h2>
      <span class="tag">Publicadas por directores técnicos y administración</span>
    </div>
    <div id="lista" class="grid grid-3">
      <div class="empty-state">Cargando noticias…</div>
    </div>
  </div>
</section>

<footer class="site-footer"><div class="wrap">Club de Voley — Sitio institucional</div></footer>

<script src="js/api.js"></script>
<script>
async function cargar() {
  const cont = document.getElementById('lista');
  try {
    const noticias = await apiFetch('/noticias');
    if (noticias.length === 0) {
      cont.innerHTML = '<div class="empty-state">Todavía no hay noticias publicadas. Volvé pronto.</div>';
      return;
    }
    cont.innerHTML = noticias.map(n => `
      <div class="card">
        <span class="meta">${new Date(n.fecha_publicacion).toLocaleDateString('es-AR')} · ${esc(n.autor || 'Club')}</span>
        <h3>${esc(n.titulo)}</h3>
        <p>${esc(n.contenido)}</p>
      </div>`).join('');
  } catch (e) {
    cont.innerHTML = `<div class="empty-state">No se pudo conectar con el servidor (${esc(e.message)}).</div>`;
  }
}
cargar();
</script>
</body>
</html>
